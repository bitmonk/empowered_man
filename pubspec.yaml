name: empowered
description: "A new Flutter project."

publish_to: "none"

version: 1.1.32+37

environment:
  sdk: ^3.5.0

dependencies:
  animated_bottom_navigation_bar: ^1.3.3
  auto_size_text: ^3.0.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  chewie: ^1.10.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.4.3+1
  dotted_border: ^2.1.0
  dropdown_button2: ^2.3.9
  easy_debounce: ^2.0.3
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  fl_chart: ^0.69.2
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_displaymode: ^0.6.0
  flutter_local_notifications: ^18.0.1
  flutter_quill: ^10.8.5
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.10+1
  flutter_widget_from_html: ^0.15.2
  form_validator: ^2.1.1
  freezed_annotation: ^2.4.1
  get: ^4.6.6
  google_fonts: ^6.2.1
  http_parser:
  image_cropper: ^8.0.2
  image_picker: ^1.1.2
  infinite_scroll_pagination: ^4.0.0
  intl: ^0.19.0
  json_annotation: ^4.9.0
  loading_animation_widget: ^1.2.1
  material_2_switch: ^1.0.0
  mime_type: ^1.0.1
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  persistent_bottom_nav_bar_v2: ^5.3.0
  pinput: ^5.0.0
  pretty_dio_logger: ^1.4.0
  rxdart: ^0.28.0
  shared_preferences: ^2.5.2
  smooth_page_indicator: ^1.2.0+3
  table_calendar: ^3.1.2
  url_launcher: ^6.3.0
  vector_graphics: any
  video_player: ^2.9.2
  video_player_android: ^2.7.16

dev_dependencies:
  build_runner: ^2.4.13
  flutter_flavorizr: ^2.3.0
  flutter_gen_runner: ^5.7.0
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.2
  injectable_generator: ^2.6.2
  json_serializable: ^6.8.0
  very_good_analysis: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon_spacing.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  adaptive_icon_background: "#ffffff"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
